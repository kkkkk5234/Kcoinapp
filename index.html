<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Lab| Supreme Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8b5cf6;
            --secondary: #06b6d4;
            --bg: #050505;
            --card: #111111;
            --text: #ffffff;
        }
        [data-theme='light'] {
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #0f172a;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            transition: all 0.5s ease;
        }
        .v4-title { font-family: 'Space Grotesk', sans-serif; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 2.5rem;
        }
        [data-theme='light'] .glass-panel {
            background: rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .cyber-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
        }
        .cyber-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.4);
        }

        .mode-chip {
            transition: all 0.4s;
            border: 1px solid transparent;
        }
        .mode-chip.active {
            background: rgba(139, 92, 246, 0.15);
            border-color: var(--primary);
            color: var(--primary);
        }

        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        
        pre { font-family: 'Space Grotesk', monospace; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-16">

    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-16">
            <div>
                <div class="flex items-center gap-2 mb-2">
                    <span class="px-3 py-1 bg-violet-600 text-[10px] font-black tracking-widest rounded-full">Version 1.0.0</span>
                    <span class="h-[1px] w-12 bg-gray-800"></span>
                    <span class="text-xs font-bold text-gray-500 uppercase tracking-widest">Model Architect Engine</span>
                </div>
                <h1 class="text-5xl font-black v4-title tracking-tighter">Prompt <span class="text-transparent bg-clip-text bg-gradient-to-r from-violet-500 to-cyan-400">Engine</span></h1>
            </div>
            
            <div class="flex items-center gap-4">
                <button id="themeToggle" class="w-12 h-12 flex items-center justify-center rounded-2xl bg-white/5 border border-white/10 hover:bg-white/10 transition-all">
                    <svg id="moonIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M20.354 15.354A9 9 0 118.646 3.646 9 9 0 0020.354 15.354z" stroke-width="2"/></svg>
                    <svg id="sunIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 9H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" stroke-width="2"/></svg>
                </button>
            </div>
        </header>

        <!-- Main Logic Container -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Left: Input Controls -->
            <div class="lg:col-span-5 space-y-6">
                <div class="glass-panel p-2 flex gap-1">
                    <button onclick="setMode('expand')" id="modeExpand" class="mode-chip active flex-1 py-4 rounded-3xl font-bold text-sm flex flex-col items-center gap-1">
                        <span class="text-lg">🛠</span>
                        <span>BUILDING-PROMPT</span>
                    </button>
                    <button onclick="setMode('shrink')" id="modeShrink" class="mode-chip flex-1 py-4 rounded-3xl font-bold text-sm flex flex-col items-center gap-1">
                        <span class="text-lg">💎</span>
                        <span>NANO-PROMPT</span>
                    </button>
                </div>

                <div class="glass-panel p-8">
                    <h3 class="text-xs font-black text-violet-500 uppercase tracking-widest mb-4">Input Context</h3>
                    <textarea id="userInput" 
                        class="w-full h-64 bg-transparent border-none outline-none text-lg resize-none placeholder:text-gray-700"
                        placeholder="Nhập ý tưởng hoặc prompt dài vào đây..."></textarea>
                    
                    <button id="execBtn" onclick="process()" class="w-full mt-6 cyber-btn py-5 rounded-2xl font-black text-white tracking-widest flex items-center justify-center gap-3">
                        <span id="btnText">EXECUTE ENGINE</span>
                        <div id="loader" class="w-5 h-5 border-2 border-white/20 border-t-white rounded-full animate-spin hidden"></div>
                    </button>
                </div>
            </div>

            <!-- Right: Results -->
            <div class="lg:col-span-7">
                <div id="resultPlaceholder" class="glass-panel h-full flex flex-col items-center justify-center p-12 text-center opacity-30 border-dashed">
                    <svg class="w-16 h-16 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z" stroke-width="1.5"/></svg>
                    <p class="font-bold">Hệ thống đang chờ lệnh thực thi...</p>
                </div>

                <div id="resultContent" class="hidden glass-panel h-full p-8 flex flex-col">
                    <div class="flex items-center justify-between mb-6">
                        <span class="flex items-center gap-2 text-[10px] font-black text-cyan-400 tracking-widest uppercase">
                            <span class="w-2 h-2 bg-cyan-400 rounded-full animate-pulse"></span> Output Generation
                        </span>
                        <button onclick="copyResult()" class="px-4 py-2 bg-white/5 hover:bg-white/10 rounded-xl text-[10px] font-bold transition-all">COPY TO CLIPBOARD</button>
                    </div>
                    <div class="flex-1 overflow-y-auto">
                        <pre id="outputText" class="text-lg leading-relaxed whitespace-pre-wrap"></pre>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 px-10 py-5 glass-panel bg-violet-600 text-white font-black text-xs tracking-widest hidden z-50 shadow-2xl">
        SYSTEM: COPIED TO CLIPBOARD
    </div>

    <script>
        const apiKey = "";
        let currentMode = 'expand';

        // Theme
        document.getElementById('themeToggle').onclick = () => {
            const isDark = document.body.parentElement.getAttribute('data-theme') === 'dark';
            document.body.parentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('sunIcon').classList.toggle('hidden');
            document.getElementById('moonIcon').classList.toggle('hidden');
        };
        // Default Dark
        document.body.parentElement.setAttribute('data-theme', 'dark');

        function setMode(m) {
            currentMode = m;
            document.getElementById('modeExpand').classList.toggle('active', m === 'expand');
            document.getElementById('modeShrink').classList.toggle('active', m === 'shrink');
            document.getElementById('userInput').placeholder = m === 'expand' 
                ? "Mô tả mục tiêu sản phẩm của bạn..." 
                : "Dán prompt phức tạp để hệ thống tối ưu";
        }

        async function process() {
            const val = document.getElementById('userInput').value.trim();
            if(!val) return;

            const btnText = document.getElementById('btnText');
            const loader = document.getElementById('loader');
            const outArea = document.getElementById('resultContent');
            const placeholder = document.getElementById('resultPlaceholder');
            const outText = document.getElementById('outputText');

            btnText.innerText = "PROCESSING...";
            loader.classList.remove('hidden');

            const systemInstructions = {
                expand: `Bạn là Senior Software Architect & Product Strategist.
                Sử dụng Cấu trúc V4 để tạo prompt chuyên nghiệp từ ý tưởng:
                1. Act as: [Vai trò chuyên gia]
                2. Mission: [Mục tiêu chiến lược]
                3. Context: [Bối cảnh & Đối tượng]
                4. Constraints: [Ràng buộc bảo mật, mở rộng, maintain]
                5. Deliverables: [Đầu ra kỹ thuật]
                6. Optimization: [Mục tiêu tối ưu]
                Yêu cầu: Viết tiếng Việt, cấu trúc phân cấp rõ ràng, chuyên nghiệp.`,
                
                shrink: `Bạn là Prompt Optimizer chuyên sâu.
                Nhiệm vụ: Nén prompt người dùng thành công thức NANO-PROMPT V4.
                CÔNG THỨC: [Expert] | Build [X] for [Y] | Constraints: [A,B,C] | Output: [Structure] | Optimize: [Goal] | Production-grade.
                QUY TẮC: 
                - Loại bỏ hoàn toàn mọi lời dẫn, lời chào, kết luận.
                - Chỉ xuất duy nhất một đoạn văn bản theo công thức trên.
                - Giữ lại các "lẽ thật" quan trọng nhất, bỏ qua các ví dụ hoặc mô tả phụ.`
            };

            let retries = 0;
            while (retries < 5) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: val }] }],
                            systemInstruction: { parts: [{ text: systemInstructions[currentMode] }] }
                        })
                    });
                    const data = await response.json();
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if(text) {
                        outText.innerText = text.trim();
                        placeholder.classList.add('hidden');
                        outArea.classList.remove('hidden');
                        break;
                    }
                } catch (e) {
                    retries++;
                    await new Promise(r => setTimeout(r, 1000 * Math.pow(2, retries)));
                }
            }

            btnText.innerText = "EXECUTE ENGINE";
            loader.classList.add('hidden');
        }

        function copyResult() {
            const text = document.getElementById('outputText').innerText;
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            
            const t = document.getElementById('toast');
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 2000);
        }
    </script>
</body>
</html>
