<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Key Free Kcoin</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{
  background: radial-gradient(circle at top left,#2b2a72,transparent 40%),
              radial-gradient(circle at bottom right,#6b4cff,transparent 40%),
              linear-gradient(to bottom,#020111,#02102f);
}
</style>
</head>

<body class="min-h-screen flex items-center justify-center text-white">

<div id="loginBox" class="w-full max-w-md p-8 rounded-2xl bg-white/5 backdrop-blur-md border border-white/10 shadow-2xl">
  <h1 class="text-xl font-bold mb-4">Nhập KEY WEB</h1>

  <input id="keywebInput" class="w-full p-3 rounded-lg text-black mb-4"
         placeholder="KEY_WEBxxxxxx">

  <button id="checkKeyweb"
    class="w-full py-3 rounded-lg bg-gradient-to-r from-purple-500 to-cyan-400 font-semibold">
    Xác nhận
  </button>

  <p id="loginMsg" class="mt-4 text-red-400 text-sm"></p>
</div>

<!-- ===== LẤY KEY FREE ===== -->
<div id="keyBoxMain" class="hidden w-full max-w-xl p-8 rounded-2xl bg-white/5 backdrop-blur-md border border-white/10 shadow-2xl">
  <h1 class="text-2xl font-bold mb-2">Key Free hôm nay</h1>
  <p class="text-sm text-slate-300 mb-4">Key có hiệu lực 7 giờ</p>

  <div id="keyBox" class="p-4 rounded-lg bg-white/10 font-mono text-lg mb-4">
    Chưa có key
  </div>

  <button id="getKey"
    class="w-full py-3 rounded-lg font-semibold bg-gradient-to-r from-purple-500 to-cyan-400">
    Lấy Key
  </button>
</div>

<script>
const RAW_KEYWEB = "https://raw.githubusercontent.com/kkkkk5234/Kcoinapp/main/keyweb.txt";
const RAW_KEYFREE = "https://raw.githubusercontent.com/kkkkk5234/Kcoinapp/main/Key.txt";

const loginBox = document.getElementById("loginBox");
const keyMain = document.getElementById("keyBoxMain");

const keywebInput = document.getElementById("keywebInput");
const loginMsg = document.getElementById("loginMsg");
const btnCheck = document.getElementById("checkKeyweb");

const keyBox = document.getElementById("keyBox");
const btnGet = document.getElementById("getKey");

// ===== KEY WEB LOGIN =====
btnCheck.onclick = async () => {
  const keyweb = keywebInput.value.trim();
  if (!keyweb) return;

  try {
    const res = await fetch(RAW_KEYWEB + "?t=" + Date.now());
    const text = await res.text();

    const keys = text.split("\n").map(k => k.trim());
    if (!keys.includes(keyweb)) {
      loginMsg.textContent = "KEY WEB không hợp lệ";
      return;
    }

    sessionStorage.setItem("keyweb_ok", "1");
    loginBox.classList.add("hidden");
    keyMain.classList.remove("hidden");

  } catch {
    loginMsg.textContent = "Lỗi kết nối";
  }
};

// ===== LẤY KEY FREE =====
btnGet.onclick = async () => {
  btnGet.disabled = true;

  try {
    const res = await fetch(RAW_KEYFREE + "?t=" + Date.now());
    const text = await res.text();

    const used = JSON.parse(localStorage.getItem("used_free_keys") || "[]");

    const keys = text.split("\n")
      .map(k => k.trim())
      .filter(k => k.startsWith("KEY_FREE"))
      .filter(k => !k.endsWith("|hethan"))
      .filter(k => !used.includes(k));

    if (keys.length === 0) {
      keyBox.textContent = "Hết key free";
      btnGet.disabled = false;
      return;
    }

    const key = keys[0];
    used.push(key);
    localStorage.setItem("used_free_keys", JSON.stringify(used));

    keyBox.textContent = key;

    // kick về nhập key web sau 3s
    setTimeout(() => {
      sessionStorage.clear();
      location.reload();
    }, 3000);

  } catch {
    keyBox.textContent = "Lỗi lấy key";
    btnGet.disabled = false;
  }
};
</script>

</body>
</html>
